<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Weight Tracker</title>
<meta name="theme-color" content="#26215C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<script>
  // Apply the saved theme before first paint so the app never flashes the wrong colours.
  try { document.documentElement.dataset.theme = localStorage.getItem('weight-theme') || 'system'; }
  catch (e) { document.documentElement.dataset.theme = 'system'; }
</script>
<style>
  :root {
    color-scheme: light dark;
    --bg: #F7F6FB; --surface-1: #FFFFFF; --surface-2: #F1F0F7;
    --border: #E2E0EC; --border-strong: #CFCCE0;
    --text: #1B1830; --text-secondary: #5E5A75; --text-muted: #8C88A3; --text-danger: #B3261E;
    --row-alt: #EEEDFE; --accent: #26215C; --quote: #534AB7; --gain: #993C1D; --loss: #0F6E56;
  }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #121019; --surface-1: #1C1927; --surface-2: #232032;
    --border: #34304A; --border-strong: #46415F;
    --text: #ECEAF5; --text-secondary: #B4B0C8; --text-muted: #8A86A0; --text-danger: #F2B8B5;
    --row-alt: #2A2640; --accent: #7F77DD; --quote: #AFA9EC; --gain: #F0997B; --loss: #5DCAA5;
  }
  @media (prefers-color-scheme: dark) {
    :root[data-theme="system"] {
      --bg: #121019; --surface-1: #1C1927; --surface-2: #232032;
      --border: #34304A; --border-strong: #46415F;
      --text: #ECEAF5; --text-secondary: #B4B0C8; --text-muted: #8A86A0; --text-danger: #F2B8B5;
      --row-alt: #2A2640; --accent: #7F77DD; --quote: #AFA9EC; --gain: #F0997B; --loss: #5DCAA5;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  /* One screen, no page scroll: the group is centred vertically; once the table outgrows
     the space, only the table scrolls (card and summary stay put). */
  main {
    max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; justify-content: center; gap: 1rem;
    height: calc(100svh - max(16px, env(safe-area-inset-top)) - max(16px, env(safe-area-inset-bottom)));
  }
  main > * { flex-shrink: 0; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .card { background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem; }
  .today { margin: 0; font-size: 15px; font-weight: 500; color: var(--text-secondary); }
  .entry { display: flex; gap: 8px; align-items: center; }
  .weight { flex: 1; position: relative; }
  .weight input {
    width: 100%; height: 52px; border: 1px solid var(--border-strong); border-radius: 10px; padding: 0 40px 0 14px;
    color: var(--text); background: var(--surface-1); font-family: inherit; font-size: 18px; font-weight: 500;
    min-width: 0; -webkit-appearance: none; appearance: none;
  }
  .weight span { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font-size: 14px; color: var(--text-secondary); pointer-events: none; }
  #wt-submit {
    min-width: 96px; height: 52px; border: none; border-radius: 10px; background: var(--accent); color: #fff;
    font-family: inherit; font-size: 17px; font-weight: 700; letter-spacing: 0.5px; cursor: pointer;
  }
  .error { margin: 8px 0 0; min-height: 1em; text-align: right; font-size: 13px; color: var(--text-danger); }
  .warn { margin: 0; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--text-danger); background: var(--surface-2); color: var(--text-danger); font-size: 14px; }
  .table-wrap {
    flex-shrink: 1; min-height: 0; overflow: auto; -webkit-overflow-scrolling: touch;
    background: var(--surface-2); border: 1px solid var(--border-strong); border-radius: 12px; padding: 0 0.5rem 0.5rem;
  }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 10px 8px; border: 1px solid var(--border-strong); text-align: right; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--text-secondary); font-weight: 500; position: sticky; top: 0; background: var(--surface-2); }
  td { background: var(--surface-1); }
  td:nth-child(2) { font-weight: 500; }
  tr.alt td { background: var(--row-alt); }
  tbody tr { cursor: pointer; }
  .sort { all: unset; cursor: pointer; }
  .gain { color: var(--gain); } .loss { color: var(--loss); } .muted { color: var(--text-muted); }
  .summary { background: var(--surface-1); border-radius: 8px; padding: 1rem; }
  #wt-latest { margin: 0; font-size: 15px; font-weight: 500; }
  #wt-delta { margin: 4px 0 0; font-size: 14px; color: var(--text-secondary); }
  #wt-quote { margin: 10px 0 0; padding-top: 10px; border-top: 1px solid var(--border); font-size: 14px; font-style: italic; color: var(--quote); }
  #wt-empty { text-align: center; color: var(--text-muted); font-size: 14px; }
  .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .icon-btn {
    all: unset; cursor: pointer; width: 44px; height: 44px; margin: -10px -10px -10px 0; border-radius: 10px;
    display: grid; place-items: center; font-size: 22px; color: var(--text-secondary);
  }
  .backdrop { position: fixed; inset: 0; z-index: 10; background: rgb(0 0 0 / 0.45); }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; max-width: 560px; margin: 0 auto;
    max-height: 90svh; overflow-y: auto; display: flex; flex-direction: column; gap: 14px;
    background: var(--surface-1); border-radius: 16px 16px 0 0;
    padding: 20px 16px max(20px, env(safe-area-inset-bottom));
  }
  .sheet h2 { margin: 0; font-size: 18px; }
  .sheet .error { margin: 0; text-align: left; }
  .row { display: flex; gap: 8px; align-items: center; }
  .field { display: flex; flex-direction: column; gap: 8px; }
  .label, .field label { font-size: 14px; color: var(--text-secondary); }
  .grow { flex: 1; }
  .btn {
    height: 52px; padding: 0 18px; border: none; border-radius: 10px; cursor: pointer;
    background: var(--accent); color: #fff; font-family: inherit; font-size: 16px; font-weight: 600;
  }
  .btn-secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--border-strong); }
  .btn-danger { background: transparent; color: var(--text-danger); border: 1px solid var(--text-danger); }
  .btn-wide { width: 100%; }
  .seg { display: flex; padding: 3px; border-radius: 10px; background: var(--surface-2); }
  .seg button {
    all: unset; flex: 1; text-align: center; padding: 10px 0; border-radius: 8px; cursor: pointer;
    font-size: 15px; color: var(--text);
  }
  .seg button[aria-checked="true"] { background: var(--surface-1); font-weight: 600; box-shadow: 0 1px 3px rgb(0 0 0 / 0.18); }
</style>
</head>
<body>
<main>
  <h1 class="sr-only">Weight tracker: log your weight in kilograms and see gain or loss versus your last entry.</h1>

  <p id="wt-storage" class="warn" role="alert" hidden>Not saved — storage is unavailable on this device.</p>

  <section class="card">
    <div class="card-top">
      <p id="wt-today" class="today"></p>
      <button id="wt-settings-btn" class="icon-btn" type="button" aria-label="Settings">&#9881;&#xFE0E;</button>
    </div>
    <form id="wt-form" class="entry" novalidate>
      <div class="weight">
        <label class="sr-only" for="wt-weight">Weight in kg</label>
        <input type="text" id="wt-weight" inputmode="decimal" autocomplete="off" placeholder="0.0">
        <span>kg</span>
      </div>
      <button id="wt-submit" type="submit">LOG</button>
    </form>
    <p id="wt-error" class="error" role="alert"></p>
  </section>

  <div id="wt-table-wrap" class="table-wrap" hidden>
    <table>
      <thead>
        <tr>
          <th><button id="wt-sort-date" class="sort" type="button">Date <span id="wt-sort-arrow">↓</span></button></th>
          <th>Weight (kg)</th>
          <th>Change</th>
        </tr>
      </thead>
      <tbody id="wt-table-body"></tbody>
    </table>
  </div>

  <div id="wt-summary" class="summary" hidden>
    <p id="wt-latest"></p>
    <p id="wt-delta"></p>
    <p id="wt-quote"></p>
  </div>

  <p id="wt-empty">No entries yet — log your first weight above.</p>
</main>

<div id="wt-backdrop" class="backdrop" hidden></div>

<section id="wt-settings" class="sheet" role="dialog" aria-modal="true" aria-labelledby="wt-settings-title" hidden>
  <h2 id="wt-settings-title">Settings</h2>
  <form id="wt-goal-form" class="field" novalidate>
    <label for="wt-goal">Goal weight</label>
    <div class="row">
      <div class="weight"><input type="text" id="wt-goal" inputmode="decimal" autocomplete="off"><span>kg</span></div>
      <button type="submit" class="btn">Save</button>
    </div>
    <p id="wt-goal-error" class="error" role="alert"></p>
  </form>
  <div class="field">
    <span class="label" id="wt-theme-label">Appearance</span>
    <div class="seg" role="radiogroup" aria-labelledby="wt-theme-label">
      <button type="button" role="radio" data-theme-choice="system">System</button>
      <button type="button" role="radio" data-theme-choice="light">Light</button>
      <button type="button" role="radio" data-theme-choice="dark">Dark</button>
    </div>
  </div>
  <div class="field" id="wt-data-field">
    <span class="label">Your data</span>
    <div class="row">
      <button type="button" id="wt-backup" class="btn btn-secondary grow">Backup</button>
      <button type="button" id="wt-restore" class="btn btn-secondary grow">Restore</button>
    </div>
    <input type="file" id="wt-restore-file" accept=".json,application/json" hidden>
    <p id="wt-data-msg" class="error" role="alert"></p>
  </div>
  <button type="button" class="btn btn-wide" data-close>Done</button>
</section>

<section id="wt-edit" class="sheet" role="dialog" aria-modal="true" aria-labelledby="wt-edit-title" hidden>
  <h2 id="wt-edit-title">Edit entry</h2>
  <p id="wt-edit-date" class="today"></p>
  <form id="wt-edit-form" class="row" novalidate>
    <div class="weight">
      <label class="sr-only" for="wt-edit-weight">Weight in kg</label>
      <input type="text" id="wt-edit-weight" inputmode="decimal" autocomplete="off"><span>kg</span>
    </div>
    <button type="submit" class="btn">Save</button>
  </form>
  <p id="wt-edit-error" class="error" role="alert"></p>
  <button type="button" id="wt-delete" class="btn btn-danger btn-wide">Delete entry</button>
  <button type="button" class="btn btn-secondary btn-wide" data-close>Cancel</button>
</section>

<script src="logic.js"></script>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const form = $('wt-form'), todayEl = $('wt-today'), weightInput = $('wt-weight');
  const errorEl = $('wt-error'), storageEl = $('wt-storage');
  const tableWrap = $('wt-table-wrap'), tableBody = $('wt-table-body');
  const sortBtn = $('wt-sort-date'), sortArrow = $('wt-sort-arrow');
  const summaryEl = $('wt-summary'), latestEl = $('wt-latest'), deltaEl = $('wt-delta'), quoteEl = $('wt-quote');
  const emptyEl = $('wt-empty');

  const KEY = 'weight-entries', SEEDED_KEY = 'weight-seeded', CLEANUP_KEY = 'weight-cleanup-1', unit = 'kg';
  const GOAL_KEY = 'weight-goal', THEME_KEY = 'weight-theme', VIEW_KEY = 'weight-view';
  const read = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const write = (k, v) => { try { localStorage.setItem(k, v); return true; } catch (e) { storageEl.hidden = false; return false; } };
  let goal = parseGoal(read(GOAL_KEY)) ?? 75;
  let entries = [];
  let sortDesc = true;

  const lossQuotes = [
    "Every kg down is a step closer to {goal}. Keep going.",
    "Progress, not perfection. You're moving the right direction.",
    "Small drops add up to big change. Stay consistent.",
    "The scale is catching up to your effort. Well done."
  ];
  const gainQuotes = [
    "One day doesn't undo your progress. Reset tomorrow.",
    "Fluctuations happen. Focus on the trend, not the day.",
    "{goal} kg is still the plan. This is just a bump in the road.",
    "Be kind to yourself. Consistency beats a single bad day."
  ];
  const steadyQuotes = [
    "Holding steady. Keep showing up for your goal.",
    "No change today — stability is progress too."
  ];
  const pick = list => list[Math.floor(Math.random() * list.length)].replace('{goal}', goal);
  const today = () => ymd(new Date());

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify({ entries, unit }));
      storageEl.hidden = true;
      return true;
    } catch (e) {
      storageEl.hidden = false; // entry stays on screen, but tell the user it isn't stored
      return false;
    }
  }

  function load() {
    let raw = null, seeded = false, cleaned = false;
    try {
      raw = localStorage.getItem(KEY);
      seeded = localStorage.getItem(SEEDED_KEY) === '1';
      cleaned = localStorage.getItem(CLEANUP_KEY) === '1';
    } catch (e) {
      storageEl.hidden = false;
    }
    // Corrupt data parses to [] and is left in storage until the next successful save.
    const result = seedIfNeeded(parseEntries(raw), seeded);
    entries = result.entries;
    if (!seeded && save()) {
      try { localStorage.setItem(SEEDED_KEY, '1'); } catch (e) { storageEl.hidden = false; }
    }
    // One-time: remove test entries logged before the Oct. 9, '26 start (user request, 2026-10-10).
    if (!cleaned) {
      const kept = dropBefore(entries, SEED.date);
      if (kept.length !== entries.length) { entries = kept; save(); }
      try { localStorage.setItem(CLEANUP_KEY, '1'); } catch (e) { storageEl.hidden = false; }
    }
    render();
  }

  function renderTable(sorted) {
    const changes = changeMap(sorted);
    const display = sortDesc ? [...sorted].reverse() : sorted;
    tableBody.innerHTML = display.map((e, i) => {
      const d = changes[e.date];
      let cell = '<span class="muted">—</span>';
      if (d === 0) cell = '<span class="muted">0.0</span>';
      else if (d !== null) cell = `<span class="${d > 0 ? 'gain' : 'loss'}">${d > 0 ? '+' : ''}${d.toFixed(1)}</span>`;
      return `<tr data-date="${e.date}" tabindex="0" role="button" aria-label="Edit ${fmtDate(e.date)}"${i % 2 ? ' class="alt"' : ''}><td>${fmtDate(e.date)}</td><td>${e.weight.toFixed(1)}</td><td>${cell}</td></tr>`;
    }).join('');
    sortArrow.textContent = sortDesc ? '↓' : '↑';
  }

  function render() {
    const sorted = sortEntries(entries);
    const last = sorted[sorted.length - 1];
    emptyEl.hidden = !!last;
    summaryEl.hidden = !last;
    tableWrap.hidden = !last;
    if (!last) return;

    latestEl.textContent = `Latest: ${last.weight.toFixed(1)} kg on ${fmtDate(last.date)}`;
    if (sorted.length >= 2) {
      const prev = sorted[sorted.length - 2];
      const diff = +(last.weight - prev.weight).toFixed(1);
      const days = Math.round((Date.parse(last.date) - Date.parse(prev.date)) / 86400000);
      const dayLabel = days + (days === 1 ? ' day' : ' days');
      if (diff === 0) {
        deltaEl.textContent = `No change since ${fmtDate(prev.date)} (${dayLabel} ago).`;
        quoteEl.textContent = pick(steadyQuotes);
      } else {
        deltaEl.textContent = `You've ${diff > 0 ? 'gained' : 'lost'} ${Math.abs(diff).toFixed(1)} kg since ${fmtDate(prev.date)} (${dayLabel} ago).`;
        quoteEl.textContent = pick(diff > 0 ? gainQuotes : lossQuotes);
      }
    } else {
      deltaEl.textContent = 'Log another entry to see your trend.';
      const toGo = +(last.weight - goal).toFixed(1);
      quoteEl.textContent = toGo > 0
        ? `${toGo.toFixed(1)} kg to go until your ${goal} kg goal. You've got this.`
        : `You've hit your ${goal} kg goal — keep it steady.`;
    }
    renderTable(sorted);
  }

  form.addEventListener('submit', ev => {
    ev.preventDefault(); // also handles Enter and the iPhone keyboard "Go" key
    errorEl.textContent = '';
    const result = validateEntry(weightInput.value, today());
    if (result.error) {
      errorEl.textContent = result.error;
      return;
    }
    entries = upsert(entries, result.date, result.weight);
    save();
    weightInput.value = '';
    showToday();
    render();
  });

  sortBtn.addEventListener('click', () => {
    sortDesc = !sortDesc;
    renderTable(sortEntries(entries));
  });

  // iPhone home-screen apps resume without reloading, so refresh the label when shown again.
  function showToday() { todayEl.textContent = `Today · ${fmtDate(today())}`; }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) showToday(); });

  // Bottom sheets: one open at a time; close with Done/Cancel, the backdrop or Escape.
  const backdrop = $('wt-backdrop');
  let openSheetEl = null;
  function openSheet(el) { closeSheet(); openSheetEl = el; el.hidden = false; backdrop.hidden = false; }
  function closeSheet() { if (!openSheetEl) return; openSheetEl.hidden = true; backdrop.hidden = true; openSheetEl = null; }
  backdrop.addEventListener('click', closeSheet);
  document.addEventListener('keydown', ev => { if (ev.key === 'Escape') closeSheet(); });
  document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeSheet));

  // Settings: goal + theme
  const settingsSheet = $('wt-settings'), goalForm = $('wt-goal-form'), goalInput = $('wt-goal'), goalError = $('wt-goal-error');
  $('wt-settings-btn').addEventListener('click', () => {
    goalInput.value = String(goal);
    goalError.textContent = '';
    openSheet(settingsSheet);
  });
  goalForm.addEventListener('submit', ev => {
    ev.preventDefault();
    const g = parseGoal(goalInput.value);
    if (g === null) { goalError.textContent = 'Enter a goal between 1 and 999 kg'; return; }
    goal = g;
    write(GOAL_KEY, String(g));
    goalError.textContent = '';
    closeSheet();
    render();
  });

  const themeBtns = document.querySelectorAll('[data-theme-choice]');
  const themeMeta = document.querySelector('meta[name="theme-color"]');
  function applyTheme(choice) {
    document.documentElement.dataset.theme = choice;
    themeBtns.forEach(b => b.setAttribute('aria-checked', String(b.dataset.themeChoice === choice)));
    themeMeta.content = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
  }
  themeBtns.forEach(b => b.addEventListener('click', () => { write(THEME_KEY, b.dataset.themeChoice); applyTheme(b.dataset.themeChoice); }));
  applyTheme(read(THEME_KEY) || 'system');

  // Edit / delete: tap a row. The date is fixed; only the weight can change.
  const editSheet = $('wt-edit'), editDateEl = $('wt-edit-date'), editForm = $('wt-edit-form');
  const editWeight = $('wt-edit-weight'), editError = $('wt-edit-error');
  let editDate = null;
  function openEdit(date) {
    const e = entries.find(x => x.date === date);
    if (!e) return;
    editDate = date;
    editDateEl.textContent = fmtDate(date);
    editWeight.value = e.weight.toFixed(1);
    editError.textContent = '';
    openSheet(editSheet);
  }
  tableBody.addEventListener('click', ev => {
    const tr = ev.target.closest('tr[data-date]');
    if (tr) openEdit(tr.dataset.date);
  });
  tableBody.addEventListener('keydown', ev => {
    if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches('tr[data-date]')) {
      ev.preventDefault();
      openEdit(ev.target.dataset.date);
    }
  });
  editForm.addEventListener('submit', ev => {
    ev.preventDefault();
    const w = parseWeight(editWeight.value);
    if (w === null) { editError.textContent = 'Enter a valid weight first'; return; }
    entries = upsert(entries, editDate, w);
    save();
    closeSheet();
    render();
  });
  $('wt-delete').addEventListener('click', () => {
    const e = entries.find(x => x.date === editDate);
    if (!e || !confirm(`Delete ${fmtDate(e.date)} · ${e.weight.toFixed(1)} kg?`)) return;
    entries = removeEntry(entries, editDate);
    save();
    closeSheet();
    render();
  });

  // Backup: iPhone Share sheet with a .json file; download where file sharing isn't supported.
  const dataMsg = $('wt-data-msg'), restoreFile = $('wt-restore-file');
  const count = n => n + (n === 1 ? ' entry' : ' entries');
  $('wt-backup').addEventListener('click', async () => {
    dataMsg.textContent = '';
    const name = `weight-backup-${today()}.json`;
    const file = new File([makeBackup(entries, goal, today())], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: 'Weight Tracker backup' }); return; }
      catch (e) { if (e.name === 'AbortError') return; } // user cancelled; any other failure falls back to download
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(file);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });

  // Restore: pick a file, confirm, then replace everything.
  $('wt-restore').addEventListener('click', () => { dataMsg.textContent = ''; restoreFile.value = ''; restoreFile.click(); });
  restoreFile.addEventListener('change', async () => {
    const f = restoreFile.files[0];
    if (!f) return;
    const r = readBackup(await f.text());
    if (r.error) { dataMsg.textContent = r.error; return; }
    const skipped = r.skipped ? ` (${r.skipped} skipped)` : '';
    if (!confirm(`Replace your ${count(entries.length)} with ${count(r.entries.length)}${skipped} from this backup?`)) return;
    entries = r.entries;
    save();
    if (r.goal !== null) { goal = r.goal; write(GOAL_KEY, String(goal)); }
    goalInput.value = String(goal);
    closeSheet();
    render();
  });

  showToday();
  load();

  // No offline cache on this computer (localhost / 127.0.0.1), so live previews always show the latest edits.
  const isLocal = ['localhost', '127.0.0.1'].includes(location.hostname);
  if ('serviceWorker' in navigator && !isLocal) {
    navigator.serviceWorker.register('sw.js').catch(() => { /* online-only fallback */ });
  }
})();
</script>
</body>
</html>
